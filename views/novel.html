<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickConverter - Novel Chapters</title>
    <link rel="stylesheet" href="../styles/tailwind.css" />
    <style>
      /* Custom Dark Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      /* Custom High-Contrast Cooldown Inputs & Amber Toggle */
      .cooldown-number-input {
        background-color: transparent !important;
        color: #f8fafc !important;
        border: none !important;
        outline: none !important;
        box-shadow: none !important;
      }
      .cooldown-number-input:focus {
        border: none !important;
        outline: none !important;
        box-shadow: none !important;
      }
      .cooldown-number-input::-webkit-inner-spin-button,
      .cooldown-number-input::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .cooldown-number-input {
        -moz-appearance: textfield;
      }
      #novel-cooldown-toggle:checked + .cooldown-slider-track {
        background-color: #d97706 !important;
      }
      #novel-cooldown-toggle:not(:checked) + .cooldown-slider-track {
        background-color: #334155 !important;
      }
    </style>
  </head>

  <body class="bg-slate-900 text-slate-50 min-h-screen font-sans flex flex-col antialiased">
    <div id="novel-root" class="contents"></div>

    <!-- Scripts -->
    <script src="../providers/wetriedtls.js"></script>
    <script src="../providers/registry.js"></script>
    <script src="../services/custom-api.js"></script>
    <script src="../services/deepseek.js"></script>
    <script src="../services/ai-service.js"></script>
    <script src="../services/storage.js"></script>
    <script src="../services/download-queue.js"></script>
    <script src="../components/ui-utils.js"></script>
    <script src="../components/ai-config-panel.js"></script>
    <script type="module" src="../components/react/queue-dock-entry.jsx"></script>
    <script type="module" src="../components/react/novel-entry.jsx"></script>
  </body>
</html>
