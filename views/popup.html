<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickConverter</title>
    <link rel="stylesheet" href="../styles/tailwind.css" />
    <style>
      /* Custom Dark Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }
      /* Custom Amber Toggle for Cooldown */
      #popup-cooldown-toggle:checked + .cooldown-popup-track {
        background-color: #d97706 !important;
      }
      #popup-cooldown-toggle:not(:checked) + .cooldown-popup-track {
        background-color: #334155 !important;
      }
    </style>
  </head>

  <body
    class="m-0 p-4 font-sans text-slate-50 bg-slate-900 flex flex-col gap-3.5 w-[360px] select-none"
  >
    <div id="popup-root"></div>

    <script src="../providers/wetriedtls.js"></script>
    <script src="../providers/registry.js"></script>
    <script src="../services/custom-api.js"></script>
    <script src="../services/deepseek.js"></script>
    <script src="../services/ai-service.js"></script>
    <script src="../services/platform.js"></script>
    <script src="../services/storage.js"></script>
    <script src="../services/download-queue.js"></script>
    <script type="module" src="../components/react/shared/queue-dock-entry.jsx"></script>
    <script type="module" src="../components/react/popup/popup-entry.jsx"></script>
    <script src="../components/add-book.js"></script>
  </body>
</html>
