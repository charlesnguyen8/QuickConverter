<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chapter Reader - QuickConverter</title>
    <link rel="stylesheet" href="../styles/tailwind.css" />
    <style>
      /* Custom Web Fonts */
      @font-face {
        font-family: 'Unkempt';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('../fonts/unkempt-regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Unkempt';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('../fonts/unkempt-bold.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Patrick Hand';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('../fonts/patrick-hand.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Merienda';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('../fonts/merienda-regular.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Merienda';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('../fonts/merienda-bold.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Pangolin';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('../fonts/pangolin.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Playwrite VN';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('../fonts/playwrite-vn.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Sedgwick Ave Display';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('../fonts/sedgwick-ave-display.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Mynerve';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('../fonts/mynerve.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Fuzzy Bubbles';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('../fonts/fuzzy-bubbles-regular.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Fuzzy Bubbles';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('../fonts/fuzzy-bubbles-bold.ttf') format('truetype');

      /* Custom Dark Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }

      /* ======================================================= */
      /* WARM SEPIA THEME PRESET                                  */
      /* ======================================================= */
      body[data-theme="sepia"] {
        background-color: #fbf0d9 !important;
        color: #2d231b !important;
      }
      body[data-theme="sepia"] header {
        background-color: rgba(251, 240, 217, 0.95) !important;
        border-color: #e5d5be !important;
      }
      body[data-theme="sepia"] #chapter-body,
      body[data-theme="sepia"] #chapter-body .paragraph-text,
      body[data-theme="sepia"] #chapter-main-title,
      body[data-theme="sepia"] #header-chapter-title {
        color: #2d231b !important;
      }
      body[data-theme="sepia"] #header-novel-title,
      body[data-theme="sepia"] #chapter-char-count,
      body[data-theme="sepia"] #chapter-reading-time {
        color: #786551 !important;
      }
      body[data-theme="sepia"] .paragraph-block:hover {
        background-color: rgba(67, 52, 34, 0.05) !important;
      }
      body[data-theme="sepia"] .paragraph-text[contenteditable="true"] {
        background-color: #f3e6cf !important;
        color: #2d231b !important;
        border-color: #a16207 !important;
      }
      body[data-theme="sepia"] #back-to-novel-btn,
      body[data-theme="sepia"] #reader-settings-btn,
      body[data-theme="sepia"] #toggle-source-drawer-btn {
        background-color: #ede0cb !important;
        color: #2d231b !important;
        border-color: #d8c4ab !important;
      }
      body[data-theme="sepia"] #back-to-novel-btn:hover,
      body[data-theme="sepia"] #reader-settings-btn:hover,
      body[data-theme="sepia"] #toggle-source-drawer-btn:hover {
        background-color: #dfceb5 !important;
        color: #1a140e !important;
      }
      body[data-theme="sepia"] #font-dec-btn,
      body[data-theme="sepia"] #font-inc-btn {
        color: #2d231b !important;
      }
      body[data-theme="sepia"] #font-size-label {
        color: #634f3b !important;
      }
      body[data-theme="sepia"] #novel-badge,
      body[data-theme="sepia"] #chapter-badge {
        background-color: #ede0cb !important;
        color: #2d231b !important;
        border-color: #d8c4ab !important;
      }
      body[data-theme="sepia"] #prev-chapter-btn,
      body[data-theme="sepia"] #next-chapter-btn,
      body[data-theme="sepia"] #bottom-novel-btn {
        background-color: #ede0cb !important;
        color: #2d231b !important;
        border-color: #d8c4ab !important;
      }
      body[data-theme="sepia"] #prev-chapter-btn:hover:not(:disabled),
      body[data-theme="sepia"] #next-chapter-btn:hover:not(:disabled),
      body[data-theme="sepia"] #bottom-novel-btn:hover {
        background-color: #dfceb5 !important;
      }
      body[data-theme="sepia"] #source-drawer {
        background-color: #f7ebce !important;
        border-color: #e5d5be !important;
        color: #2d231b !important;
      }
      body[data-theme="sepia"] #source-drawer-text {
        color: #382a1d !important;
      }
      body[data-theme="sepia"] ::-webkit-scrollbar-track {
        background: #fbf0d9;
      }
      body[data-theme="sepia"] ::-webkit-scrollbar-thumb {
        background: #d8c4ab;
      }

      /* ======================================================= */
      /* OLED MIDNIGHT THEME PRESET                              */
      /* ======================================================= */
      body[data-theme="oled"] {
        background-color: #000000 !important;
        color: #f4f4f5 !important;
      }
      body[data-theme="oled"] header {
        background-color: rgba(0, 0, 0, 0.95) !important;
        border-color: #27272a !important;
      }
      body[data-theme="oled"] #chapter-body,
      body[data-theme="oled"] #chapter-body .paragraph-text,
      body[data-theme="oled"] #chapter-main-title {
        color: #f4f4f5 !important;
      }
      body[data-theme="oled"] .paragraph-block:hover {
        background-color: rgba(255, 255, 255, 0.04) !important;
      }

      /* ======================================================= */
      /* FOREST NIGHT THEME PRESET                               */
      /* ======================================================= */
      body[data-theme="forest"] {
        background-color: #0d1712 !important;
        color: #e2f2e9 !important;
      }
      body[data-theme="forest"] header {
        background-color: rgba(13, 23, 18, 0.95) !important;
        border-color: #1a3325 !important;
      }
      body[data-theme="forest"] #chapter-body,
      body[data-theme="forest"] #chapter-body .paragraph-text,
      body[data-theme="forest"] #chapter-main-title {
        color: #e2f2e9 !important;
      }
      body[data-theme="forest"] #header-novel-title,
      body[data-theme="forest"] #chapter-char-count,
      body[data-theme="forest"] #chapter-reading-time {
        color: #7fa08d !important;
      }
      body[data-theme="forest"] .paragraph-block:hover {
        background-color: rgba(255, 255, 255, 0.04) !important;
      }
      body[data-theme="forest"] #back-to-novel-btn,
      body[data-theme="forest"] #reader-settings-btn,
      body[data-theme="forest"] #toggle-source-drawer-btn,
      body[data-theme="forest"] #novel-badge,
      body[data-theme="forest"] #chapter-badge,
      body[data-theme="forest"] #prev-chapter-btn,
      body[data-theme="forest"] #next-chapter-btn,
      body[data-theme="forest"] #bottom-novel-btn {
        background-color: #14241c !important;
        color: #c4ded0 !important;
        border-color: #1f3d2c !important;
      }

      /* In-reader Typography Popover Base & Slate Theme (Fully Opaque) */
      #reader-typography-popover {
        background-color: #0f172a !important; /* Solid Slate 900 - 100% opaque, no see-through */
        border-color: #334155 !important;     /* Slate 700 */
        color: #f8fafc !important;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(51, 65, 85, 0.6) !important;
      }
      #reader-typography-popover #in-reader-font-family {
        background-color: #020617 !important;
        border-color: #334155 !important;
        color: #f1f5f9 !important;
      }
      #reader-typography-popover #in-reader-font-family option {
        background-color: #0f172a !important;
        color: #f1f5f9 !important;
      }
      .in-reader-theme-btn.active {
        border-color: #6366f1 !important;
      }
      .popover-segment-btn.active {
        background-color: #1e293b;
        color: #a5b4fc;
        border-color: #475569;
        font-weight: 600;
      }

      /* Sepia Popover */
      body[data-theme="sepia"] #toggle-typography-popover-btn {
        background-color: #ede0cb !important;
        color: #2d231b !important;
        border-color: #d8c4ab !important;
      }
      body[data-theme="sepia"] #toggle-typography-popover-btn:hover {
        background-color: #dfceb5 !important;
        color: #1a140e !important;
      }
      body[data-theme="sepia"] #reader-typography-popover {
        background-color: #f7ebce !important;
        border-color: #d8c4ab !important;
        color: #2d231b !important;
        box-shadow: 0 20px 25px -5px rgba(45, 35, 27, 0.2), 0 8px 10px -6px rgba(45, 35, 27, 0.15) !important;
      }
      body[data-theme="sepia"] #reader-typography-popover .popover-subtext {
        color: #634f3b !important;
      }
      body[data-theme="sepia"] #reader-typography-popover .popover-btn-group {
        background-color: #ede0cb !important;
        border-color: #d8c4ab !important;
      }
      body[data-theme="sepia"] #reader-typography-popover .popover-segment-btn {
        color: #524131 !important;
      }
      body[data-theme="sepia"] #reader-typography-popover .popover-segment-btn:hover {
        color: #1a140e !important;
        background-color: #dfceb5 !important;
      }
      body[data-theme="sepia"] #reader-typography-popover .popover-segment-btn.active {
        background-color: #fbf0d9 !important;
        color: #8c531b !important;
        border-color: #c9ad8a !important;
      }
      body[data-theme="sepia"] #reader-typography-popover #in-reader-font-dec,
      body[data-theme="sepia"] #reader-typography-popover #in-reader-font-inc {
        background-color: #ede0cb !important;
        color: #2d231b !important;
        border-color: #d8c4ab !important;
      }
      body[data-theme="sepia"] #reader-typography-popover #in-reader-font-dec:hover,
      body[data-theme="sepia"] #reader-typography-popover #in-reader-font-inc:hover {
        background-color: #dfceb5 !important;
        color: #1a140e !important;
      }
      body[data-theme="sepia"] #reader-typography-popover #in-reader-font-val {
        color: #8c531b !important;
      }
      body[data-theme="sepia"] #reader-typography-popover #close-typography-popover-btn {
        color: #634f3b !important;
      }
      body[data-theme="sepia"] #reader-typography-popover #close-typography-popover-btn:hover {
        color: #1a140e !important;
        background-color: #dfceb5 !important;
      }
      body[data-theme="sepia"] #reader-typography-popover .border-b,
      body[data-theme="sepia"] #reader-typography-popover .border-t {
        border-color: #d8c4ab !important;
      }
      body[data-theme="sepia"] #reader-typography-popover .in-reader-theme-btn.active {
        border-color: #8c531b !important;
      }
      body[data-theme="sepia"] #reader-typography-popover #in-reader-font-family {
        background-color: #ede0cb !important;
        border-color: #d8c4ab !important;
        color: #2d231b !important;
      }
      body[data-theme="sepia"] #reader-typography-popover #in-reader-font-family option {
        background-color: #fbf0d9 !important;
        color: #2d231b !important;
      }

      /* OLED Popover */
      body[data-theme="oled"] #toggle-typography-popover-btn {
        background-color: #18181b !important;
        color: #f4f4f5 !important;
        border-color: #27272a !important;
      }
      body[data-theme="oled"] #toggle-typography-popover-btn:hover {
        background-color: #27272a !important;
      }
      body[data-theme="oled"] #reader-typography-popover {
        background-color: #09090b !important;
        border-color: #27272a !important;
        color: #f4f4f5 !important;
      }
      body[data-theme="oled"] #reader-typography-popover .popover-subtext {
        color: #a1a1aa !important;
      }
      body[data-theme="oled"] #reader-typography-popover .popover-btn-group {
        background-color: #18181b !important;
        border-color: #27272a !important;
      }
      body[data-theme="oled"] #reader-typography-popover .popover-segment-btn {

      }
      body[data-theme="oled"] #reader-typography-popover .popover-segment-btn:hover {

        background-color: #27272a !important;
      }
      body[data-theme="oled"] #reader-typography-popover .popover-segment-btn.active {
        background-color: #27272a !important;
        color: #ffffff !important;
        border-color: #52525b !important;
      }
      body[data-theme="oled"] #reader-typography-popover #in-reader-font-dec,
      body[data-theme="oled"] #reader-typography-popover #in-reader-font-inc {
        background-color: #18181b !important;
        color: #f4f4f5 !important;
        border-color: #27272a !important;
      }
      body[data-theme="oled"] #reader-typography-popover #in-reader-font-dec:hover,
      body[data-theme="oled"] #reader-typography-popover #in-reader-font-inc:hover {
        background-color: #27272a !important;
      }
      body[data-theme="oled"] #reader-typography-popover .border-b,
      body[data-theme="oled"] #reader-typography-popover .border-t {
        border-color: #27272a !important;
      }
      body[data-theme="oled"] #reader-typography-popover .in-reader-theme-btn.active {
        border-color: #e4e4e7 !important;
      }
      body[data-theme="oled"] #reader-typography-popover #in-reader-font-family {
        background-color: #18181b !important;
        border-color: #27272a !important;
        color: #f4f4f5 !important;
      }
      body[data-theme="oled"] #reader-typography-popover #in-reader-font-family option {
        background-color: #09090b !important;
        color: #f4f4f5 !important;
      }

      /* Forest Popover */
      body[data-theme="forest"] #toggle-typography-popover-btn {
        background-color: #14241c !important;
        color: #c4ded0 !important;
        border-color: #1f3d2c !important;
      }
      body[data-theme="forest"] #toggle-typography-popover-btn:hover {
        background-color: #1a3325 !important;
        color: #e2f2e9 !important;
      }
      body[data-theme="forest"] #reader-typography-popover {
        background-color: #0f1d16 !important;
        border-color: #1f3d2c !important;
        color: #e2f2e9 !important;
      }
      body[data-theme="forest"] #reader-typography-popover .popover-subtext {
        color: #7fa08d !important;
      }
      body[data-theme="forest"] #reader-typography-popover .popover-btn-group {
        background-color: #14241c !important;
        border-color: #1f3d2c !important;
      }
      body[data-theme="forest"] #reader-typography-popover .popover-segment-btn {
        color: #7fa08d !important;
      }
      body[data-theme="forest"] #reader-typography-popover .popover-segment-btn:hover {
        color: #e2f2e9 !important;
        background-color: #1a3325 !important;
      }
      body[data-theme="forest"] #reader-typography-popover .popover-segment-btn.active {

      }
      body[data-theme="forest"] #reader-typography-popover #in-reader-font-dec,
      body[data-theme="forest"] #reader-typography-popover #in-reader-font-inc {
        background-color: #14241c !important;
        color: #e2f2e9 !important;
        border-color: #1f3d2c !important;
      }
      body[data-theme="forest"] #reader-typography-popover #in-reader-font-dec:hover,
      body[data-theme="forest"] #reader-typography-popover #in-reader-font-inc:hover {
        background-color: #1a3325 !important;
      }
      body[data-theme="forest"] #reader-typography-popover #in-reader-font-val {
        color: #34d399 !important;
      }
      body[data-theme="forest"] #reader-typography-popover .border-b,
      body[data-theme="forest"] #reader-typography-popover .border-t {
        border-color: #1f3d2c !important;
      }
      body[data-theme="forest"] #reader-typography-popover .in-reader-theme-btn.active {
        border-color: #10b981 !important;
      }
      body[data-theme="forest"] #reader-typography-popover #in-reader-font-family {
        background-color: #14241c !important;
        border-color: #1f3d2c !important;
        color: #e2f2e9 !important;
      }
      body[data-theme="forest"] #reader-typography-popover #in-reader-font-family option {
        background-color: #0f1d16 !important;
        color: #e2f2e9 !important;
      }
    </style>
  </head>

  <body class="bg-slate-900 text-slate-50 min-h-screen font-sans flex flex-col antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="reader-root" class="contents"></div>

    <!-- Scripts -->
    <script src="../providers/wetriedtls.js"></script>
    <script src="../providers/registry.js"></script>
    <script src="../services/custom-api.js"></script>
    <script src="../services/deepseek.js"></script>
    <script src="../services/ai-service.js"></script>
    <script src="../services/storage.js"></script>
    <script src="../services/download-queue.js"></script>
    <script type="module" src="../components/react/shared/queue-dock-entry.jsx"></script>
    <script type="module" src="../components/react/reader/reader-entry.jsx"></script>
  </body>
</html>
