<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickConverter - Settings</title>
    <link rel="stylesheet" href="../styles/tailwind.css" />
    <style>
      /* Custom Web Fonts */
      @font-face {
        font-family: 'Unkempt';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('../fonts/unkempt-regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Unkempt';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('../fonts/unkempt-bold.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Patrick Hand';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('../fonts/patrick-hand.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Merienda';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('../fonts/merienda-regular.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Merienda';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('../fonts/merienda-bold.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Pangolin';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('../fonts/pangolin.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Playwrite VN';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('../fonts/playwrite-vn.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Sedgwick Ave Display';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('../fonts/sedgwick-ave-display.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Mynerve';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('../fonts/mynerve.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Fuzzy Bubbles';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('../fonts/fuzzy-bubbles-regular.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Fuzzy Bubbles';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('../fonts/fuzzy-bubbles-bold.ttf') format('truetype');
      }

      /* Custom Dark Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
    </style>
  </head>

  <body class="bg-slate-900 text-slate-50 min-h-screen font-sans flex flex-col antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="settings-root"></div>

    <!-- Scripts -->
    <script src="../providers/wetriedtls.js"></script>
    <script src="../providers/registry.js"></script>
    <script src="../services/storage.js"></script>
    <script src="../services/cloud-sync.js"></script>
    <script src="../services/custom-api.js"></script>
    <script src="../services/deepseek.js"></script>
    <script src="../services/ai-service.js"></script>
    <script type="module" src="../components/react/settings/settings-entry.jsx"></script>
    <script src="../components/settings-deepseek.js"></script>
  </body>
</html>
