<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Style Template</title>
    <link rel="stylesheet" href="tailwind.css" />
    <style>
      /* Custom Dark Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }
    </style>
  </head>

  <body
    class="m-0 p-4 font-sans text-slate-50 bg-slate-900 flex flex-col gap-4 w-[360px]"
  >
    <!-- Header Style -->
    <header class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <h1
          class="text-xl font-bold leading-tight bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent"
        >
          QuickConverter
        </h1>
      </div>
      <button
        type="button"
        class="cursor-pointer rounded-md px-3 py-1.5 text-sm font-semibold text-white bg-emerald-600 transition hover:bg-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50"
      >
        Action
      </button>
    </header>

    <!-- Card / Section Container Style -->
    <section class="flex flex-col gap-3 rounded-md border border-slate-700 bg-slate-800 p-4">
      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-slate-400">Label</label>
        <input
          type="text"
          placeholder="Input placeholder..."
          class="bg-slate-900 border border-slate-700 rounded-md text-slate-50 px-3 py-2 text-sm outline-none transition focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 placeholder-slate-400"
        />
      </div>

      <button
        type="button"
        class="w-full cursor-pointer rounded-md px-3 py-2 text-sm font-semibold text-white bg-indigo-500 transition hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
      >
        Primary Button
      </button>
    </section>
  </body>
</html>
